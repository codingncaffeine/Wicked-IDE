name: CI

# Every push to main or to the gate branch (tools/push.sh lands a batch on main only after this
# has run it there) and every pull request: build the whole solution on Linux and on Windows
# with warnings as errors, and run the tests: every test but the Window tier, whose area walks
# are the Smoke tier (tools/test-tiers.sh). The full suite, the Window tier included, runs
# when started by hand with tier "full" (packaging/release.sh runs it locally before a release).
on:
  push:
    branches: [main, gate]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "push = every test but the Window tier; full = every test"
        type: choice
        options: [full, push]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # A hung test ends the job here, not at GitHub's six-hour limit.
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      WICKED_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (warnings are errors)
        run: dotnet build Wicked.slnx -c Release -warnaserror

      # Every test is named as it passes; one that hangs is stopped after two minutes with a dump. A test that fails is
      # run once more on its own: passing then, it is reported as flaky and the job stays green (tools/ci-test.sh).
      - name: Tests
        shell: bash
        run: tools/ci-test.sh TestResults ${{ (github.event_name == 'workflow_dispatch' && inputs.tier == 'full') && 'full' || 'push' }}

      - name: Keep the hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 7
          if-no-files-found: ignore
